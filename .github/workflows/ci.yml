name: Weather App Automation Check

# 1. Trigger the workflow every time someone pushes code changes
on:
  push:
    branches: [ main ]

jobs:
  quality-check:
    # 2. Tell GitHub to give you a clean virtual machine to test on
    runs-on: ubuntu-latest

    steps:
    # Step A: Copy your repository files into the test runner machine
    - name: Checkout project code
      uses: actions/checkout@v4

    # Step B: Provide a quick test message confirming your system is ready
    - name: Run Basic Build Verification
      run: |
        echo "Successfully verified project files!"
        echo "Target file check: index.html and script.js are present."

