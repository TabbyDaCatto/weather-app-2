name: Deploy Weather App to GitHub Pages with Tests

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      # NEW STEP: Swap out the placeholder for the real key in the cloud!
      - name: Inject Live API Key Secret
        run: |
          sed -i 's/YOUR_SECRET_API_KEY_PLACEHOLDER/${{ secrets.OPENWEATHER_API_KEY }}/g' script.js
        # (Note: If your API_KEYS object lives in a different file than script.js, 
        # replace 'script.js' above with your correct file name path!)

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
