name: Deploy Weather App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Run Tests
        run: |
          npm ci
          npm test

      - name: Inject API Key
        run: printf 'export const API_KEY = "%s";\n' "${{ secrets.OPENWEATHER_API_KEY }}" > config.js

      - name: Package Static Site
        run: |
          mkdir -p _site
          cp index.html style.css api.js config.js firebase.js index.js logic_1.js logic_2.js logic_3.js ui.js _site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4